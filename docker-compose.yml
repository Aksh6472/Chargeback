version: '3.8'

services:
  # 1. PostgreSQL Database with pgvector Extension
  postgres_pgvector:
    image: pgvector/pgvector:pg15
    container_name: chargeback_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: chargeback_evidence
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # 2. FastAPI Backend Service
  backend:
    build: .
    container_name: chargeback_fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - DATABASE_URL=postgresql://postgres:password123@postgres_pgvector:5432/chargeback_evidence
      - GEMINI_API_KEY=${GEMINI_API_KEY:-demo_key_placeholder}
      - SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-placeholder}
    depends_on:
      - postgres_pgvector
    restart: unless-stopped

  # 3. Streamlit Frontend Service
  frontend:
    build: .
    container_name: chargeback_streamlit
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      - backend
    restart: unless-stopped

  # 4. n8n Workflow Automation Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: chargeback_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    restart: unless-stopped

volumes:
  pgvector_data:
  n8n_data:
